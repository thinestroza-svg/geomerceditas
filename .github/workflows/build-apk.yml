name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar la app web (compatible con WebView antiguos)
        run: npm run build
      - name: Copiar la app web al proyecto Android
        run: npx cap sync android
      - name: Compilar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../GeoMerceditas.apk
      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GeoMerceditas 1.0.${{ github.run_number }}
          body: Descargue GeoMerceditas.apk desde el celular e instálelo.
          files: GeoMerceditas.apk
