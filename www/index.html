<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f3a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plano de Campo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
/* Layout: mapa a pantalla completa; barra de coordenadas arriba, botonera abajo, hojas deslizables para listas */
:root{
  --bg:#f3f5f1; --panel:#ffffff; --ink:#18231d; --muted:#5d6b62; --line:#d5ddd6;
  --accent:#1f6b4a; --accent-ink:#ffffff; --rec:#c2362b; --gps:#1d64d8; --warn:#9a6a00;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111814; --panel:#1b2520; --ink:#e7eee9; --muted:#9aaba0; --line:#2f3d35;
  --accent:#3fa774; --accent-ink:#06130c; --rec:#ef5b4f; --gps:#5a9bff; --warn:#e0b23c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:absolute;inset:0;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gps);outline-offset:2px}
[hidden]{display:none!important}

/* Barra superior */
.top{position:absolute;z-index:1000;left:0;right:0;top:0;
  padding:calc(var(--safe-t) + 8px) max(10px,var(--safe-r)) 8px max(10px,var(--safe-l));
  display:flex;gap:8px;align-items:stretch;pointer-events:none}
.top>*{pointer-events:auto}
.mapsel{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 12px;box-shadow:0 2px 10px rgb(0 0 0/.15);text-align:left}
.mapsel b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapsel small{color:var(--muted);font-size:12px}
.mapsel .txt{min-width:0;flex:1}
.ibtn{width:46px;flex:none;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 10px rgb(0 0 0/.15)}
.ibtn svg{width:22px;height:22px}

/* Lectura de coordenadas */
.coords{position:absolute;z-index:1000;left:max(10px,var(--safe-l));top:calc(var(--safe-t) + 70px);
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;font:12.5px/1.35 var(--mono);font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgb(0 0 0/.12)}
.coords .lbl{font:600 10px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.coords .acc.bad{color:var(--warn)}
.crosshair{position:absolute;z-index:900;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none}
.crosshair::before,.crosshair::after{content:"";position:absolute;background:var(--ink);opacity:.75}
.crosshair::before{left:16px;top:0;width:2px;height:34px}.crosshair::after{top:16px;left:0;height:2px;width:34px}

/* Botonera */
.bar{position:absolute;z-index:1000;left:0;right:0;bottom:0;
  padding:10px max(10px,var(--safe-r)) calc(var(--safe-b) + 10px) max(10px,var(--safe-l));
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;pointer-events:none}
.bar button{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:600;box-shadow:0 2px 10px rgb(0 0 0/.15);min-height:62px}
.bar svg{width:24px;height:24px}
.bar button.on{background:var(--gps);color:#fff;border-color:var(--gps)}
.bar button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
.bar button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.recinfo{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 84px);
  background:var(--rec);color:#fff;border-radius:999px;padding:6px 14px;font:600 13px var(--ui);font-variant-numeric:tabular-nums;
  display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgb(0 0 0/.2)}
.recinfo .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recinfo .dot{animation:none}}

/* Hojas */
.scrim{position:fixed;inset:0;z-index:2000;background:rgb(0 0 0/.35)}
.sheet{position:fixed;z-index:2001;left:0;right:0;bottom:0;max-height:86%;display:flex;flex-direction:column;background:var(--panel);
  border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgb(0 0 0/.25);padding-bottom:var(--safe-b)}
.sheet header{display:flex;align-items:center;gap:8px;padding:14px max(16px,var(--safe-r)) 10px max(16px,var(--safe-l));border-bottom:1px solid var(--line)}
.sheet header h2{font-size:17px;margin:0;flex:1;text-wrap:balance}
.sheet .body{overflow:auto;padding:12px max(16px,var(--safe-r)) 16px max(16px,var(--safe-l));display:flex;flex-direction:column;gap:12px}
.x{background:none;border:0;padding:6px;border-radius:8px}.x svg{width:22px;height:22px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 14px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 45%,var(--line))}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1;min-width:120px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:600 11px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{font:16px var(--ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.swatches{display:flex;gap:10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .sw{width:14px;height:14px;border-radius:50%;flex:none}
.item .sw.trk{border-radius:3px;height:6px;width:18px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--muted);font:12px var(--mono);font-variant-numeric:tabular-nums}
.item.cur{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;line-height:1.5}
.sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.kv{font:13px var(--mono);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6}

/* Pantalla de bienvenida */
.welcome{position:absolute;inset:0;z-index:1500;display:grid;place-items:center;background:var(--bg);
  padding:calc(var(--safe-t) + 24px) max(24px,var(--safe-r)) calc(var(--safe-b) + 24px) max(24px,var(--safe-l))}
.welcome .card{max-width:420px;display:flex;flex-direction:column;gap:14px;text-align:center}
.welcome h1{margin:0;font-size:26px;letter-spacing:-.01em}
.welcome p{margin:0;color:var(--muted);line-height:1.55}
.grid-ill{width:120px;height:120px;margin:0 auto}

.toast{position:fixed;z-index:3000;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 70px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;max-width:90%;text-align:center;box-shadow:0 4px 16px rgb(0 0 0/.3)}
.busy{position:fixed;inset:0;z-index:3500;display:grid;place-items:center;background:rgb(0 0 0/.45);color:#fff;font-weight:600}

/* Marcadores */
.me{width:18px;height:18px;border-radius:50%;background:var(--gps);border:3px solid #fff;box-shadow:0 0 0 1px rgb(0 0 0/.3),0 1px 6px rgb(0 0 0/.4)}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0/.45)}
.pinlbl{position:absolute;left:24px;top:-2px;white-space:nowrap;font:700 12px var(--ui);color:#111;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.leaflet-container{font-family:var(--ui)}
</style>
</head>
<body>
<div id="map"></div>
<div class="crosshair" id="cross" hidden></div>

<div class="top">
  <button class="mapsel" id="btnMaps" aria-label="Cambiar plano">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
    <span class="txt"><b id="mapName">Sin plano</b><small id="mapSub">Toque para cargar un GeoPDF</small></span>
  </button>
  <button class="ibtn" id="btnSettings" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
</div>

<div class="coords" id="coords">
  <div class="lbl" id="cLbl">GPS · CTM12</div>
  <div id="cE">E —</div><div id="cN">N —</div>
  <div class="acc" id="cAcc">Buscando señal…</div>
</div>

<div class="recinfo" id="recinfo" hidden><span class="dot"></span><span id="recTxt">0 m · 00:00</span></div>

<nav class="bar">
  <button id="btnGps" aria-label="Seguir mi ubicación">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Ubicarme</button>
  <button id="btnPoint" class="primary" aria-label="Marcar punto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><path d="M12 7v6M9 10h6"/></svg>Punto</button>
  <button id="btnTrack" aria-label="Grabar track">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19c3-1 3-6 6-7s5 3 8 1 2-7 2-7"/><circle cx="4" cy="19" r="2"/></svg><span id="trkLbl">Track</span></button>
  <button id="btnList" aria-label="Puntos, tracks y exportar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Lista</button>
</nav>

<div class="welcome" id="welcome" hidden>
  <div class="card">
    <svg class="grid-ill" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="10" y="10" width="100" height="100" rx="6" opacity=".35"/>
      <path d="M43 10v100M77 10v100M10 43h100M10 77h100" opacity=".25"/>
      <path d="M22 92c12-6 14-30 30-34s22 14 34 6 12-36 12-36" stroke-width="2.5"/>
      <circle cx="60" cy="58" r="7" fill="currentColor"/>
    </svg>
    <h1>Plano de Campo</h1>
    <p>Cargue un plano en GeoPDF, vea su posición GPS sobre él, marque puntos, grabe tracks y expórtelos en KML, GPX o CSV con coordenadas CTM12.</p>
    <button class="btn primary" id="btnFirst">Cargar GeoPDF</button>
    <button class="btn" id="btnFirstRestore">Restaurar un respaldo</button>
    <p class="note">Los planos y los datos se guardan solo en este teléfono y funcionan sin conexión.</p>
  </div>
</div>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileBk" accept="application/json,.json" hidden>
<div id="sheets"></div>

<script src="lib/leaflet.js"></script>
<script src="lib/Leaflet.ImageOverlay.Rotated.js"></script>
<script src="lib/proj4.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
